name: Validate lab metadata

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Validate JSON fixtures, fixture pages and links
        run: node scripts/validate.mjs
